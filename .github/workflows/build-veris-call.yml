name: Build Veris Call APK
on:
  push:
    branches: [ veris-call ]
    paths:
      - 'veris-call/**'
      - '.github/workflows/build-veris-call.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: veris-call
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: veris-call-debug-apk
          path: veris-call/app/build/outputs/apk/debug/app-debug.apk
