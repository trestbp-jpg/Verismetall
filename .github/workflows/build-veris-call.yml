name: Build Veris Call APK
on:
  push:
    branches: [ veris-call ]
    paths:
      - 'veris-call/**'
      - '.github/workflows/build-veris-call.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare selected app background
        working-directory: veris-call
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          python3 -c 'import base64,pathlib; p=pathlib.Path("screen_bg.b64"); s=p.read_text().strip(); s += "="*((4-len(s)%4)%4); pathlib.Path("app/src/main/res/drawable-nodpi/screen_bg.jpg").write_bytes(base64.b64decode(s, validate=True))'
          file app/src/main/res/drawable-nodpi/screen_bg.jpg
      - name: Build debug APK
        working-directory: veris-call
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: veris-call-debug-apk
          path: veris-call/app/build/outputs/apk/debug/app-debug.apk
